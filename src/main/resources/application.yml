spring:
  application:
    name: JobTrail

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  ai:
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
      on-client-errors: false
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-4o-mini
        timeout: 30s
        max-tokens: 700

  jackson:
    deserialization:
      fail-on-unknown-properties: true

job-match:
  rate-limit:
    requests: ${JOB_MATCH_REQUESTS_PER_MINUTE:5}
    window: 1m

jwt:
  secret: ${JWT_SECRET:jobtrail-default-jwt-secret-key-must-have-at-least-32-bytes!}
  expiration: ${JWT_EXPIRATION:PT1H}
  issuer: ${JWT_ISSUER:jobtrail}

jobtrail:
  demo-data:
    enabled: ${JOBTRAIL_DEMO_DATA_ENABLED:true}

springdoc:
  cache:
    disabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
    version: openapi_3_0
